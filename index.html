<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Shooter – Gõ từ để bắn hạ</title>
<style>
:root{--bg:#f4f6fb;--surface:#fff;--text:#1b2233;--muted:#6b7488;--accent:#4f46e5;--hit:#16a34a;--danger:#dc2626;--border:#d9deea;--canvas:#eef1fa;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1220;--surface:#171c2e;--text:#e8ecf8;--muted:#8d97b3;--accent:#818cf8;--hit:#4ade80;--danger:#f87171;--border:#2a3250;--canvas:#0b0f1d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1220;--surface:#171c2e;--text:#e8ecf8;--muted:#8d97b3;--accent:#818cf8;--hit:#4ade80;--danger:#f87171;--border:#2a3250;--canvas:#0b0f1d;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{height:100%;display:flex;flex-direction:column;max-width:900px;margin:0 auto;padding:12px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px}
h1{margin:0 0 4px;font-size:1.5rem}
p.sub{margin:0 0 14px;color:var(--muted);font-size:.95rem}
textarea{width:100%;height:220px;resize:vertical;border:1px solid var(--border);border-radius:10px;padding:12px;font:16px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);color:var(--text)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px}
button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:11px 20px;font-size:1rem;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
label{color:var(--muted);font-size:.9rem;display:flex;gap:6px;align-items:center}
#setup{margin:auto 0}
#game{display:none;flex:1;min-height:0;flex-direction:column;gap:8px}
#hud{display:flex;justify-content:space-between;align-items:center;font-weight:600;gap:8px}
#hud span.m{color:var(--muted);font-weight:500}
#wrap{flex:1;min-height:0;position:relative;border:1px solid var(--border);border-radius:16px;overflow:hidden;background:var(--canvas)}
canvas{width:100%;height:100%;display:block}
#over{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,14,28,.72);padding:16px}
#over .panel{max-width:420px;width:100%;text-align:center;max-height:100%;overflow:auto}
#missed{text-align:left;font-size:.9rem;color:var(--muted);margin:10px 0}
#kb{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.hint{color:var(--muted);font-size:.85rem;text-align:center}
</style>
</head>
<body>
<div id="app">
  <div id="setup" class="panel">
    <h1>🚀 Word Shooter</h1>
    <p class="sub">Nhập danh sách từ cần học (mỗi dòng một từ). Có thể thêm nghĩa: <b>apple - quả táo</b></p>
    <textarea id="words" spellcheck="false" placeholder="apple - quả táo&#10;journey - chuyến đi&#10;achieve&#10;borrow, lend, steady"></textarea>
    <div class="row">
      <button id="start">Bắt đầu chơi</button>
      <button class="ghost" id="sample">Dùng từ mẫu</button>
      <label>Chế độ: <select id="mode" style="padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:.95rem"><option value="en">Gõ từ tiếng Anh</option><option value="vi">Thấy nghĩa tiếng Việt → gõ từ tiếng Anh</option><option value="mix">Hỗn hợp (cả hai dạng)</option></select></label>
      <label><input type="checkbox" id="showMean" checked> Hiện nghĩa dưới từ tiếng Anh</label>
    </div>
    <p class="sub" id="count" style="margin-top:12px"></p>
  </div>

  <div id="game">
    <div id="hud"><div>Điểm: <span id="score">0</span> <span class="m">· Cấp <span id="lvl">1</span></span></div><div id="lives"></div><button class="ghost" id="quit" style="padding:6px 12px">Thoát</button></div>
    <div id="wrap"><canvas id="cv"></canvas>
      <div id="over"><div class="panel">
        <h1>Kết thúc!</h1>
        <div id="stats"></div>
        <div id="missed"></div>
        <div class="row" style="justify-content:center"><button id="again">Chơi lại</button><button class="ghost" id="edit">Sửa danh sách</button></div>
      </div></div>
    </div>
    <input id="kb" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="hint">Gõ chữ cái đầu để khóa mục tiêu, gõ hết từ để bắn · Esc: bỏ khóa</div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const SAMPLE="apple - quả táo\njourney - chuyến đi\nachieve - đạt được\nborrow - mượn\nsteady - vững vàng\nchallenge - thử thách\nbrave - dũng cảm\nforest - khu rừng\nreliable - đáng tin cậy\nimprove - cải thiện";
try{const s=localStorage.getItem("ws_words");$("words").value=s!==null?s:SAMPLE}catch(e){$("words").value=SAMPLE}
function parse(t){
  const out=[],seen=new Set();
  t.split(/\n/).forEach(line=>{
    line=line.trim();if(!line)return;
    let parts=/[-–:\t]/.test(line)?[line]:line.split(",");
    parts.forEach(p=>{
      const m=p.split(/\s*[-–:\t]\s*/);
      const w=(m[0]||"").trim().toLowerCase().replace(/[^a-z'\- ]/g,"");
      if(!w||w.length>24||seen.has(w))return;
      seen.add(w);out.push({text:w,mean:(m.slice(1).join(" - ")||"").trim()});
    });
  });
  return out;
}
function upd(){$("count").textContent="Số từ hợp lệ: "+parse($("words").value).length}
$("words").addEventListener("input",upd);upd();
$("sample").onclick=()=>{$("words").value=SAMPLE;upd()};

const cv=$("cv"),ctx=cv.getContext("2d");
let W=0,H=0,dpr=1,list=[],G=null,raf=0,last=0;
function resize(){const r=$("wrap").getBoundingClientRect();dpr=window.devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
window.addEventListener("resize",()=>{if($("game").style.display==="flex")resize()});
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function newGame(){
  G={words:[],lasers:[],parts:[],score:0,lives:5,level:1,killed:0,keys:0,hits:0,target:null,queue:[],spawn:0,over:false,missed:new Set(),shake:0};
  $("over").style.display="none";hud();
}
function hud(){$("score").textContent=G.score;$("lvl").textContent=G.level;$("lives").textContent="❤️".repeat(Math.max(G.lives,0))}
function spawn(){
  if(!G.queue.length)G.queue=shuffle(list);
  let tries=0,item;
  do{item=G.queue.shift();if(!G.queue.length)G.queue=shuffle(list);tries++}
  while(tries<6&&G.words.some(w=>w.text[0]===item.text[0]||w.text===item.text)&&list.length>1);
  const mode=$("mode").value;
  G.sp=(G.sp||0)+1;
  const pVi=Math.min(.8,.1+(G.sp-1)*.02);
  const vn=mode==="vi"||(mode==="mix"&&item.mean&&Math.random()<pVi);
  ctx.font="600 22px ui-monospace,Menlo,Consolas,monospace";
  let w=ctx.measureText(item.text).width;
  if(vn){ctx.font="600 19px system-ui,sans-serif";w=Math.max(w,ctx.measureText(item.mean).width)}
  const x=Math.max(10,Math.min(W-w-10,Math.random()*(W-w-20)+10));
  G.words.push({text:item.text,mean:item.mean,vn,x,y:-10,w,speed:(28+G.level*7)*(0.85+Math.random()*0.3),typed:0});
}
function explode(x,y,c){for(let i=0;i<18;i++){const a=Math.random()*6.283,s=40+Math.random()*140;G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.6,c})}}

function loop(t){
  const dt=Math.min((t-last)/1000||0,.05);last=t;
  if(!G.over){
    G.spawn-=dt;
    if(G.spawn<=0){spawn();G.spawn=Math.max(.9,2.6-G.level*.18)}
    for(const w of G.words){w.y+=w.speed*dt}
    for(const w of G.words.slice()){
      if(w.y>H-46){
        G.words.splice(G.words.indexOf(w),1);G.lives--;G.shake=.3;G.missed.add(w.text+(w.mean?" – "+w.mean:""));
        if(G.target===w)G.target=null;explode(w.x+w.w/2,H-46,css("--danger"));hud();
        if(G.lives<=0){end()}
      }
    }
  }
  for(const l of G.lasers)l.life-=dt;G.lasers=G.lasers.filter(l=>l.life>0);
  for(const p of G.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}G.parts=G.parts.filter(p=>p.l>0);
  G.shake=Math.max(0,G.shake-dt);
  draw();raf=requestAnimationFrame(loop);
}
function draw(){
  ctx.clearRect(0,0,W,H);
  const acc=css("--accent"),hit=css("--hit"),txt=css("--text"),mut=css("--muted"),dan=css("--danger");
  ctx.save();if(G.shake>0)ctx.translate((Math.random()-.5)*6,(Math.random()-.5)*6);
  ctx.strokeStyle=dan;ctx.globalAlpha=.25;ctx.setLineDash([6,6]);ctx.beginPath();ctx.moveTo(0,H-46);ctx.lineTo(W,H-46);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
  ctx.textBaseline="middle";
  for(const w of G.words){
    ctx.font="600 22px ui-monospace,Menlo,Consolas,monospace";
    const isT=G.target===w;
    const hh=w.vn?58:36;
    if(isT){ctx.fillStyle=acc;ctx.globalAlpha=.15;ctx.fillRect(w.x-8,w.y-18,w.w+16,hh);ctx.globalAlpha=1;ctx.strokeStyle=acc;ctx.strokeRect(w.x-8,w.y-18,w.w+16,hh)}
    const done=w.text.slice(0,w.typed),rest=w.text.slice(w.typed);
    if(w.vn){
      ctx.font="600 19px system-ui,sans-serif";ctx.fillStyle=acc;ctx.fillText(w.mean,w.x,w.y);
      ctx.font="600 20px ui-monospace,Menlo,Consolas,monospace";
      ctx.fillStyle=hit;ctx.fillText(done,w.x,w.y+26);
      ctx.fillStyle=mut;ctx.fillText("_".repeat(rest.length).split("").join(" "),w.x+ctx.measureText(done).width+(done?0:0),w.y+26);
    }else{
    ctx.fillStyle=hit;ctx.fillText(done,w.x,w.y);
    ctx.fillStyle=txt;ctx.fillText(rest,w.x+ctx.measureText(done).width,w.y);
    }
    if(!w.vn&&w.mean&&$("showMean").checked){ctx.font="13px system-ui,sans-serif";ctx.fillStyle=mut;ctx.fillText(w.mean,w.x,w.y+24)}
  }
  for(const l of G.lasers){ctx.strokeStyle=acc;ctx.globalAlpha=Math.max(l.life/.15,0);ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(l.x1,l.y1);ctx.lineTo(l.x2,l.y2);ctx.stroke();ctx.globalAlpha=1;ctx.lineWidth=1}
  for(const p of G.parts){ctx.globalAlpha=Math.max(p.l/.6,0);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,4,4)}
  ctx.globalAlpha=1;
  // ship
  const sx=W/2,sy=H-22;ctx.fillStyle=acc;ctx.beginPath();ctx.moveTo(sx,sy-16);ctx.lineTo(sx+18,sy+14);ctx.lineTo(sx,sy+7);ctx.lineTo(sx-18,sy+14);ctx.closePath();ctx.fill();
  ctx.restore();
}
function shoot(w){
  G.lasers.push({x1:W/2,y1:H-38,x2:w.x+w.w/2,y2:w.y,life:.15});
  explode(w.x+w.w/2,w.y,css("--hit"));
  G.words.splice(G.words.indexOf(w),1);G.target=null;
  G.killed++;G.score+=w.text.length*10+G.level*5;
  if(G.killed%8===0)G.level++;
  hud();
}
function onKey(e){
  if(!G||G.over||$("game").style.display!=="flex")return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==="Escape"){if(G.target){G.target.typed=0;G.target=null}return}
  if(e.key.length!==1)return;
  const k=e.key.toLowerCase();
  if(!/[a-z'\- ]/.test(k))return;
  if(k===" ")e.preventDefault();
  G.keys++;
  if(!G.target){
    const c=G.words.filter(w=>w.text[0]===k).sort((a,b)=>b.y-a.y)[0];
    if(!c){G.shake=.12;return}
    G.target=c;
  }
  const w=G.target;
  if(w.text[w.typed]===k){w.typed++;G.hits++;if(w.typed>=w.text.length)shoot(w)}
  else G.shake=.1;
}
window.addEventListener("keydown",onKey);

function end(){
  G.over=true;
  const acc=G.keys?Math.round(G.hits/G.keys*100):0;
  $("stats").innerHTML="<p style='font-size:1.1rem'>Điểm: <b>"+G.score+"</b> · Cấp "+G.level+"</p><p class='sub'>Đã bắn: "+G.killed+" từ · Chính xác: "+acc+"%</p>";
  const m=[...G.missed];
  $("missed").innerHTML=m.length?"<b style='color:var(--text)'>Từ cần ôn lại:</b><br>"+m.map(s=>"• "+s.replace(/</g,"&lt;")).join("<br>"):"";
  $("over").style.display="flex";
}
function begin(){
  list=parse($("words").value);
  if(!list.length){alert("Hãy nhập ít nhất 1 từ tiếng Anh.");return}
  if($("mode").value==="vi"){
    list=list.filter(x=>x.mean);
    if(!list.length){alert("Chế độ này cần danh sách có nghĩa, ví dụ: apple - quả táo");return}
  }
  try{localStorage.setItem("ws_words",$("words").value)}catch(e){}
  $("setup").style.display="none";$("game").style.display="flex";
  resize();newGame();last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
  $("kb").focus();
}
function toSetup(){cancelAnimationFrame(raf);$("game").style.display="none";$("setup").style.display="block"}
$("start").onclick=begin;$("again").onclick=begin;$("edit").onclick=toSetup;$("quit").onclick=toSetup;
$("wrap").addEventListener("pointerdown",()=>$("kb").focus());
</script>
</body>
</html>
